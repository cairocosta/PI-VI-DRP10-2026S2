version: "3.5"

services:
  postgres:
    container_name: "DRP10-PJI310-A2025S1-T001"
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drp10_pji310_a2025s1_t001
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  data:
